workflows:
  ios-imzasiz:
    name: Cloudio iOS (imzasiz)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Paketleri yukle
        script: flutter pub get
      - name: iOS build (imzasiz)
        script: flutter build ios --release --no-codesign
      - name: IPA yarat
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/Runner.app
          zip -qry Cloudio.ipa Payload
    artifacts:
      - build/ios/iphoneos/Cloudio.ipa
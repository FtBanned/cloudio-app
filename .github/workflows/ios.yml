name: Cloudio iOS (imzasiz)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Kodu çək
        uses: actions/checkout@v4

      - name: Flutter qur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Paketləri yüklə
        run: flutter pub get

      - name: iOS build (imzasız)
        run: flutter build ios --release --no-codesign

      - name: IPA yarat
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r cloudio.ipa Payload

      - name: IPA-nı yüklə
        uses: actions/upload-artifact@v4
        with:
          name: cloudio-ipa
          path: cloudio.ipa
